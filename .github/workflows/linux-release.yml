name: Linux Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"

      - name: Install Flutter (FVM)
        run: |
          fvm install 3.35.7
          fvm use 3.35.7 --force
          fvm flutter --version

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip cmake ninja-build pkg-config libgtk-3-dev curl clang

      - name: Build and Package Linux (zip, deb)
        shell: bash
        run: |
          set -euo pipefail
          ROOT_DIR=$(pwd)
          PROJECT_ID="flutter-ruffle"
          PROJECT_BIN="flutter_ruffle"
          PUBSPEC_PATH="${ROOT_DIR}/pubspec.yaml"
          DIST_DIR="${ROOT_DIR}/dist/linux"
          LOGO_PNG_DEFAULT="${ROOT_DIR}/packages/ruffle/third_party/ruffle/tests/tests/swfs/avm2/stage3d_texture_bytearray/ruffle_logo.png"

          # ------------------------------
          # 函数：parse_version（解析 pubspec.yaml 版本）
          # 返回：BASE_VERSION、BUILD_NUMBER、DEB_VERSION（x.y.z[-build]）
          # ------------------------------
          parse_version(){
            local line value base build deb
            line=$(grep -E "^version:\s*" "${PUBSPEC_PATH}" | head -n1 || true)
            if [[ -z "${line}" ]]; then
              echo "pubspec.yaml 未找到 version" >&2; exit 1
            fi
            value=$(awk -F': ' '{print $2}' <<<"${line}" | tr -d '[:space:]')
            if [[ -z "${value}" ]]; then
              echo "pubspec.yaml version 为空" >&2; exit 1
            fi
            if [[ "${value}" == *"+"* ]]; then
              base=${value%%+*}; build=${value##*+}; deb="${base}-${build}"
            else
              base=${value}; build=""; deb="${base}"
            fi
            echo "${base}|${build}|${deb}"
          }

          # ------------------------------
          # 函数：get_arch（映射架构到 deb/appimage 命名）
          # 返回：DEB_ARCH|APP_ARCH
          # ------------------------------
          get_arch(){
            local m; m=$(uname -m)
            case "${m}" in
              x86_64) echo "amd64|x86_64" ;;
              aarch64|arm64) echo "arm64|aarch64" ;;
              armv7l) echo "armhf|armv7l" ;;
              *) echo "amd64|x86_64" ;;
            esac
          }

          # ------------------------------
          # 构建：启用 Linux 桌面并构建 release
          # ------------------------------
          fvm flutter config --enable-linux-desktop
          fvm flutter pub get
          fvm flutter build linux --release

          # 定位 bundle
          BUNDLE_DIR="${ROOT_DIR}/build/linux/x64/release/bundle"
          if [[ ! -d "${BUNDLE_DIR}" ]]; then
            echo "未找到 bundle 目录：${BUNDLE_DIR}" >&2; exit 1
          fi

          mkdir -p "${DIST_DIR}"
          IFS='|' read -r BASE_VERSION BUILD_NUMBER DEB_VERSION < <(parse_version)
          IFS='|' read -r DEB_ARCH APP_ARCH < <(get_arch)

          echo "版本：base=${BASE_VERSION} build=${BUILD_NUMBER} deb=${DEB_VERSION} 架构：deb=${DEB_ARCH} app=${APP_ARCH}"

          # ------------------------------
          # 生成 ZIP（包含版本号）
          # ------------------------------
          ZIP_PATH="${DIST_DIR}/${PROJECT_ID}-linux-${APP_ARCH}-${BASE_VERSION}.zip"
          (cd "${BUNDLE_DIR}" && zip -r "${ZIP_PATH}" .)
          echo "ZIP 输出：${ZIP_PATH}"

          # ------------------------------
          # 生成 Debian 包（带版本号）
          # 目录结构：
          #   /opt/flutter-ruffle <bundle>
          #   /usr/bin/flutter-ruffle -> 启动器
          #   /usr/share/applications/flutter-ruffle.desktop
          #   /usr/share/icons/hicolor/256x256/apps/flutter-ruffle.png
          # ------------------------------
          DEB_ROOT="${DIST_DIR}/deb/${PROJECT_ID}_${DEB_VERSION}_${DEB_ARCH}"
          rm -rf "${DEB_ROOT}" && mkdir -p "${DEB_ROOT}"
          mkdir -p "${DEB_ROOT}/opt/${PROJECT_ID}"
          cp -a "${BUNDLE_DIR}/"* "${DEB_ROOT}/opt/${PROJECT_ID}/"
          mkdir -p "${DEB_ROOT}/usr/bin"
          printf '#!/usr/bin/env bash\nexec /opt/%s/%s "$@"\n' "${PROJECT_ID}" "${PROJECT_BIN}" > "${DEB_ROOT}/usr/bin/${PROJECT_ID}"
          chmod +x "${DEB_ROOT}/usr/bin/${PROJECT_ID}"
          mkdir -p "${DEB_ROOT}/usr/share/applications"
          printf "[Desktop Entry]\nName=Flutter Ruffle\nComment=Ruffle player (Flutter)\nExec=${PROJECT_ID}\nIcon=${PROJECT_ID}\nTerminal=false\nType=Application\nCategories=Utility;\nStartupWMClass=${PROJECT_BIN}\n" > "${DEB_ROOT}/usr/share/applications/${PROJECT_ID}.desktop"
          if [[ -f "${LOGO_PNG_DEFAULT}" ]]; then
            mkdir -p "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps"
            cp "${LOGO_PNG_DEFAULT}" "${DEB_ROOT}/usr/share/icons/hicolor/256x256/apps/${PROJECT_ID}.png"
          fi
          mkdir -p "${DEB_ROOT}/DEBIAN"
          printf "Package: ${PROJECT_ID}\nVersion: ${DEB_VERSION}\nSection: utils\nPriority: optional\nArchitecture: ${DEB_ARCH}\nMaintainer: lycstar <opensource@example.com>\nDescription: Flutter Ruffle - Ruffle player (Flutter)\nDepends: libgtk-3-0, libstdc++6, libgcc1, libunwind8, libgl1\n" > "${DEB_ROOT}/DEBIAN/control"
          DEB_OUT="${DIST_DIR}/${PROJECT_ID}_${DEB_VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --build "${DEB_ROOT}" "${DEB_OUT}"
          echo "DEB 输出：${DEB_OUT}"

      - name: Publish GitHub Release (push tag)
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          allowUpdates: true
          generateReleaseNotes: true
          replaceArtifacts: true
          artifacts: |
            dist/linux/*.zip
            dist/linux/*.deb

      - name: Publish GitHub Release (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          token: ${{ github.token }}
          allowUpdates: true
          generateReleaseNotes: true
          replaceArtifacts: true
          artifacts: |
            dist/linux/*.zip
            dist/linux/*.deb
