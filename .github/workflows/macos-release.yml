name: macOS Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 Git 标签（例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout (tag push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2025-10-01

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"

      - name: Install Flutter (FVM)
        run: |
          fvm install 3.35.7
          fvm use 3.35.7 --force
          fvm flutter --version

      - name: Build macOS (unsigned) and package zip + dmg
        shell: bash
        run: |
          set -euo pipefail

          fvm flutter config --enable-macos-desktop
          fvm flutter pub get
          fvm flutter build macos --release

          APP_DIR="build/macos/Build/Products/Release"
          APP_PATH="$(find "${APP_DIR}" -maxdepth 1 -name "*.app" -print -quit || true)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No .app found under ${APP_DIR}" >&2
            ls -la "${APP_DIR}" || true
            exit 1
          fi

          VERSION_LINE="$(grep -E "^[[:space:]]*version:[[:space:]]*" pubspec.yaml | head -n1 || true)"
          if [[ -z "${VERSION_LINE}" ]]; then
            echo "version not found in pubspec.yaml" >&2
            exit 1
          fi
          RAW_VERSION="$(echo "${VERSION_LINE}" | sed -E 's/^[[:space:]]*version:[[:space:]]*//' | tr -d '[:space:]')"
          BASE_VERSION="${RAW_VERSION%%+*}"
          ARCH="$(uname -m)"

          mkdir -p dist/macos
          ZIP_PATH="dist/macos/flutter-ruffle-macos-${ARCH}-${BASE_VERSION}.zip"
          DMG_PATH="dist/macos/flutter-ruffle-macos-${ARCH}-${BASE_VERSION}.dmg"
          rm -f "${ZIP_PATH}"
          rm -f "${DMG_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_PATH}"
          echo "Packaged: ${ZIP_PATH}"

          DMG_STAGING="$(mktemp -d)"
          cp -R "${APP_PATH}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"
          hdiutil create -volname "Flutter Ruffle" -srcfolder "${DMG_STAGING}" -ov -format UDZO "${DMG_PATH}"
          rm -rf "${DMG_STAGING}"
          echo "Packaged: ${DMG_PATH}"

      - name: Publish GitHub Release (push)
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          allowUpdates: true
          generateReleaseNotes: true
          replacesArtifacts: true
          artifacts: |
            dist/macos/*.zip
            dist/macos/*.dmg

      - name: Publish GitHub Release (manual tag)
        if: github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          token: ${{ github.token }}
          allowUpdates: true
          generateReleaseNotes: true
          replacesArtifacts: true
          artifacts: |
            dist/macos/*.zip
            dist/macos/*.dmg
